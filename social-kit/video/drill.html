<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excel-Drills Promo</title>
<!--
  Excel-Drills – animiertes Werbevideo (20 s, ohne Ton).
  drill.html?t=7000&w=1080&h=1920  -> rendert exakt den Zustand bei t = 7000 ms (für die Frame-Ausgabe)
  drill.html?w=1080&h=1080         -> läuft als Endlos-Vorschau (requestAnimationFrame)
  Alle Texte stehen im Objekt TEXT weiter unten.
-->
<style>
  :root {
    --accent: #107C41; --accent-strong: #0b5c30; --accent-soft: #e7f3ec;
    --bg: #fbfbf9; --surface: #fff; --text: #1d1f1e; --muted: #565b58; --border: #d9ddda;
    --grid-head: #f1f3f2; --target: #fff6cc; --target-border: #c99a00;
    --err-bg: #fdeceb; --err-text: #9b1c14; --err-line: #d64033;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow: hidden; background: var(--bg); }
  body { font-family: var(--font); color: var(--text); -webkit-font-smoothing: antialiased; }
  #stage { position: relative; overflow: hidden; background: var(--bg); }
  #bggrid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(16,124,65,.06) 2px, transparent 2px), linear-gradient(90deg, rgba(16,124,65,.06) 2px, transparent 2px);
    background-size: 90px 90px; }
  #bgglow { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, rgba(16,124,65,.10), transparent 60%); }
  #content { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; transform-origin: 0 0; }
  .abs { position: absolute; }

  /* Intro */
  #intro { left: 0; top: 0; width: 1080px; height: 1350px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #wm { display: flex; align-items: center; gap: 34px; }
  .logo { width: 150px; height: 150px; border-radius: 30px; background: var(--accent); color: #fff; font: 800 104px/150px Arial, sans-serif; text-align: center; box-shadow: 0 18px 40px rgba(16,124,65,.28); }
  #wmText { font-size: 128px; font-weight: 800; letter-spacing: -3px; }
  #wmText span { color: var(--accent); }
  #claim { margin-top: 56px; font-size: 64px; line-height: 1.22; font-weight: 700; max-width: 900px; }
  #claim em { font-style: normal; color: var(--accent); }
  #claim s { text-decoration-color: var(--err-line); text-decoration-thickness: 6px; color: var(--muted); }

  /* HUD */
  #hud { left: 60px; top: 14px; width: 960px; height: 84px; display: flex; align-items: center; justify-content: space-between; }
  #hudBrand { display: flex; align-items: center; gap: 18px; font-size: 44px; font-weight: 800; letter-spacing: -1px; }
  #hudBrand .logo { width: 68px; height: 68px; border-radius: 14px; font-size: 46px; line-height: 68px; box-shadow: none; }
  #hudStats { display: flex; gap: 18px; }
  .pill { display: flex; align-items: center; gap: 10px; height: 72px; padding: 0 26px 0 18px; border-radius: 36px; background: var(--surface); border: 3px solid var(--border); font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .pill svg { width: 44px; height: 44px; }

  /* Aufgabe */
  #task { left: 60px; top: 122px; width: 960px; height: 124px; border-radius: 22px; background: var(--surface); border: 3px solid var(--border); display: flex; align-items: center; gap: 26px; padding: 0 34px; box-shadow: 0 10px 30px rgba(0,0,0,.06); }
  #task .tag { font-size: 30px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: #fff; background: var(--accent); padding: 10px 18px; border-radius: 12px; }
  #task .q { font-size: 50px; font-weight: 700; }
  #task .q b { font-family: var(--mono); background: var(--target); border: 3px solid var(--target-border); border-radius: 10px; padding: 0 12px; }

  /* Formelleiste */
  #fbar { left: 60px; top: 270px; width: 960px; height: 96px; border: 3px solid var(--border); border-bottom: 0; border-radius: 18px 18px 0 0; background: var(--surface); display: flex; align-items: center; }
  #fbar .nm { width: 130px; height: 100%; display: flex; align-items: center; justify-content: center; border-right: 3px solid var(--border); font: 700 40px var(--mono); color: var(--muted); }
  #fbar .fx { width: 90px; text-align: center; font: italic 700 42px Georgia, serif; color: var(--muted); }
  #ftext { font: 700 52px var(--mono); white-space: pre; display: flex; align-items: center; }

  /* Tabelle */
  #grid { left: 60px; top: 366px; width: 960px; height: 568px; background: var(--surface); border: 3px solid var(--border); border-radius: 0 0 18px 18px; overflow: hidden; box-shadow: 0 16px 40px rgba(0,0,0,.08); }
  .cell { position: absolute; display: flex; align-items: center; padding: 0 26px; font-size: 50px; border-right: 2px solid var(--border); border-bottom: 2px solid var(--border); white-space: nowrap; }
  .hd { background: var(--grid-head); color: var(--muted); font-size: 36px; font-weight: 700; justify-content: center; padding: 0; }
  .num { justify-content: flex-end; font-variant-numeric: tabular-nums; }
  .bold { font-weight: 800; }
  #b6 { background: var(--target); }
  #b6sel { position: absolute; border: 6px solid var(--accent); pointer-events: none; }
  .ref { position: absolute; border: 5px dashed; border-radius: 4px; pointer-events: none; }
  #refB2 { border-color: #1f6fd1; background: rgba(31,111,209,.07); }
  #refB5 { border-color: #c2410c; background: rgba(194,65,12,.07); }
  #refR  { border-color: #1f6fd1; background: rgba(31,111,209,.08); }
  .caret { display: inline-block; width: 5px; height: 1.05em; background: var(--text); margin-left: 3px; }
  .fn { color: var(--accent-strong); }
  .bad { color: var(--err-line); text-decoration: underline wavy var(--err-line) 3px; text-underline-offset: 8px; }
  .r1 { color: #1f6fd1; } .r2 { color: #c2410c; }
  #pointer { left: 0; top: 0; width: 70px; height: 70px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.3)); }
  #clickRing { width: 90px; height: 90px; border-radius: 50%; border: 6px solid var(--accent); }

  /* Feedback */
  .fb { left: 60px; top: 966px; width: 960px; height: 236px; border-radius: 24px; display: flex; align-items: center; gap: 30px; padding: 0 38px; }
  #fbErr { background: var(--err-bg); border: 4px solid var(--err-line); color: var(--err-text); }
  #fbErr { gap: 24px; padding: 0 30px; }
  #fbErr .ic { flex: none; width: 76px; height: 76px; border-radius: 50%; background: var(--err-line); color: #fff; font: 800 54px/76px Arial, sans-serif; text-align: center; }
  #fbErr .tx { font-size: 42px; line-height: 1.3; font-weight: 600; }
  code { font-family: var(--mono); font-weight: 800; background: rgba(255,255,255,.75); border-radius: 8px; padding: 0 10px; color: var(--text); }
  #fbOk { background: var(--accent-soft); border: 4px solid var(--accent); color: var(--accent-strong); }
  #fbOk .big { font-size: 76px; font-weight: 800; letter-spacing: -1px; }
  #fbOk .small { font-size: 38px; font-weight: 600; color: var(--muted); margin-top: 4px; }
  #medal { flex: none; width: 170px; height: 190px; }
  #level { background: var(--surface); border: 4px solid var(--accent); flex-direction: column; align-items: stretch; justify-content: center; gap: 22px; }
  #lvTop { display: flex; justify-content: space-between; align-items: baseline; font-size: 34px; font-weight: 700; color: var(--muted); gap: 20px; white-space: nowrap; }
  #lvName { font-size: 50px; font-weight: 800; color: var(--text); }
  #lvBar { height: 48px; border-radius: 24px; background: var(--grid-head); border: 3px solid var(--border); overflow: hidden; }
  #lvFill { height: 100%; width: 0; background: linear-gradient(90deg, #0b5c30, #107C41 60%, #2fae6a); border-radius: 24px; }

  /* Untertitel */
  #caption { left: 60px; top: 1232px; width: 960px; height: 104px; display: flex; align-items: center; justify-content: center; }
  .cap { position: absolute; padding: 14px 34px; border-radius: 18px; background: #1d1f1e; color: #fff; font-size: 44px; font-weight: 700; white-space: nowrap; }

  /* Outro */
  #outroBg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: var(--accent); }
  #outro { left: 0; top: 0; width: 1080px; height: 1350px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #fff; }
  #outro .logo { background: #fff; color: var(--accent); box-shadow: 0 18px 40px rgba(0,0,0,.18); }
  #oWm { font-size: 104px; font-weight: 800; letter-spacing: -3px; margin-top: 30px; }
  #oFacts { margin-top: 54px; font-size: 54px; font-weight: 700; line-height: 1.5; }
  #oFacts span { display: inline-block; }
  #oUrl { margin-top: 64px; font-size: 66px; font-weight: 800; background: #fff; color: var(--accent-strong); padding: 22px 48px; border-radius: 999px; box-shadow: 0 14px 34px rgba(0,0,0,.2); }
</style>
</head>
<body>
<div id="stage">
  <div id="bggrid"></div><div id="bgglow"></div>
  <div id="content">
    <!-- HUD -->
    <div id="hud" class="abs">
      <div id="hudBrand"><div class="logo">X</div>Excel-Drills</div>
      <div id="hudStats">
        <div class="pill" id="pStreak">
          <svg viewBox="0 0 24 24"><defs><linearGradient id="fl" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e8590c"/><stop offset="1" stop-color="#fcc419"/></linearGradient></defs><path fill="url(#fl)" d="M12 2c1 3.2-.6 5-2 6.6C8.6 10.2 7 12 7 14.6 7 18 9.3 21 12.6 21 16 21 18 18.2 18 15c0-3.2-2-5-2.8-6.2-.3 1.6-1 2.6-2 3.2.4-3.4-.2-7.6-1.2-10z"/><path fill="#fff3bf" d="M12.4 13c.2 1.4-.8 2.2-1.4 3-.5.6-.8 1.2-.8 2 0 1.2.9 2 2.2 2 1.4 0 2.4-1 2.4-2.6 0-1.6-1.2-2.8-2.4-4.4z"/></svg>
          <span id="streakNum">0</span>
        </div>
        <div class="pill" id="pXp">
          <svg viewBox="0 0 24 24"><path fill="#107C41" d="M12 1.8l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 16.6l-5.9 3.3 1.3-6.6L2.5 8.7l6.6-.8z"/></svg>
          <span id="xpNum">40</span>&nbsp;XP
        </div>
      </div>
    </div>

    <!-- Aufgabe -->
    <div id="task" class="abs"><div class="tag">Aufgabe</div><div class="q" id="taskQ"></div></div>

    <!-- Formelleiste + Tabelle -->
    <div id="fbar" class="abs"><div class="nm">B6</div><div class="fx">fx</div><div id="ftext"></div></div>
    <div id="grid" class="abs"></div>

    <!-- Feedback -->
    <div id="fbErr" class="abs fb"><div class="ic">!</div><div class="tx" id="errTx"></div></div>
    <div id="fbOk" class="abs fb">
      <svg id="medal" viewBox="0 0 100 112">
        <path d="M30 0h16l10 34H40z" fill="#1f6fd1"/><path d="M54 0h16L60 34H44z" fill="#d64033"/>
        <defs><radialGradient id="bz" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#f3c08a"/><stop offset=".55" stop-color="#cd7f32"/><stop offset="1" stop-color="#8a4f1c"/></radialGradient></defs>
        <circle cx="50" cy="72" r="38" fill="url(#bz)" stroke="#7a4517" stroke-width="3"/>
        <circle cx="50" cy="72" r="28" fill="none" stroke="#f6d3a8" stroke-width="2.5" opacity=".7"/>
        <path d="M50 54l5.3 11 12 1.4-8.9 8.2 2.4 11.9L50 80.6l-10.8 5.9 2.4-11.9-8.9-8.2 12-1.4z" fill="#fbe3c4"/>
      </svg>
      <div><div class="big" id="okBig"></div><div class="small" id="okSmall"></div></div>
    </div>
    <div id="level" class="abs fb">
      <div id="lvTop"><span id="lvName"></span><span id="lvXp"></span></div>
      <div id="lvBar"><div id="lvFill"></div></div>
    </div>

    <!-- Untertitel -->
    <div id="caption" class="abs"></div>

    <!-- Mauszeiger -->
    <div id="clickRing" class="abs"></div>
    <svg id="pointer" class="abs" viewBox="0 0 24 24"><path d="M4 2l15 11.5-6.6.9 3.9 7.4-3 1.5-3.8-7.5L4 20z" fill="#fff" stroke="#1d1f1e" stroke-width="1.6" stroke-linejoin="round"/></svg>

    <!-- Intro -->
    <div id="intro" class="abs">
      <div id="wm"><div class="logo">X</div><div id="wmText"></div></div>
      <div id="claim"></div>
    </div>
  </div>
  <div id="outroBg"></div>
  <div id="outroWrap" style="position:absolute;left:0;top:0;width:1080px;height:1350px;transform-origin:0 0">
    <div id="outro" class="abs">
      <div class="logo">X</div>
      <div id="oWm"></div>
      <div id="oFacts"></div>
      <div id="oUrl"></div>
    </div>
  </div>
</div>

<script>
// ---------- Texte (hier anpassen) ----------
var TEXT = {
  wordmark: 'Excel-<span>Drills</span>',
  claim: 'Excel lernen durch <em>Üben</em>,<br>nicht durch <s>Zuschauen</s>',
  task: 'Berechne in <b>B6</b> die Summe',
  wrong: '=SUM(B2,B5)',
  right: '=SUMME(B2:B5)',
  err: 'Auf Deutsch heisst die Funktion <code>SUMME</code>.<br>Argumente trennst du mit <code>;</code> statt <code>,</code>',
  okBig: 'Richtig! +10 XP',
  okSmall: 'Bronze-Medaille erhalten',
  lvBefore: 'Level 1 · Anfänger', lvAfter: 'Level 2 · Sachbearbeiter',
  captions: [ // [start, end, text]
    [2300, 7900, 'Echte Aufgaben – direkt im Browser'],
    [7900, 11000, 'Fehler? Du erfährst sofort, warum.'],
    [11000, 15000, 'Korrigieren, verstehen, weiter.'],
    [15000, 18000, 'XP sammeln, Level aufsteigen.']
  ],
  outroWm: 'Excel-Drills',
  outroFacts: '<span>42 Übungen</span> · <span>18 gratis</span><br><span>ohne Anmeldung</span>',
  url: 'excel-drills.ch'
};
var ROWS = [['Filiale', 'Umsatz CHF'], ['Zürich', "12'400"], ['Bern', "8'300"], ['Basel', "9'100"], ['Luzern', "4'800"], ['Total', '']];
var RESULT = "34'600";
var DURATION = 20000;

// ---------- Setup ----------
var q = new URLSearchParams(location.search);
var W = +q.get('w') || 1080, H = +q.get('h') || 1920;
var $ = function (id) { return document.getElementById(id); };
var stage = $('stage'); stage.style.width = W + 'px'; stage.style.height = H + 'px';
document.body.style.width = W + 'px'; document.body.style.height = H + 'px';
// Inhaltsbox 1080x1350. Hochformat: Safe-Zones oben 250 / unten 320 px (bei 1920 Höhe).
var sc, ox, oy;
if (H / W > 1.5) { sc = W / 1080; var avail = H - (250 + 320) * sc; sc = Math.min(sc, avail / 1350); ox = (W - 1080 * sc) / 2; oy = 250 * (W / 1080) + (avail - 1350 * sc) / 2; }
else { sc = Math.min((W - 40) / 1080, (H - 40) / 1350); ox = (W - 1080 * sc) / 2; oy = (H - 1350 * sc) / 2; }
['content', 'outroWrap'].forEach(function (id) { $(id).style.transform = 'translate(' + ox + 'px,' + oy + 'px) scale(' + sc + ')'; });

$('wmText').innerHTML = TEXT.wordmark; $('claim').innerHTML = TEXT.claim; $('taskQ').innerHTML = TEXT.task;
$('errTx').innerHTML = TEXT.err; $('okBig').textContent = TEXT.okBig; $('okSmall').textContent = TEXT.okSmall;
$('oWm').textContent = TEXT.outroWm; $('oFacts').innerHTML = TEXT.outroFacts; $('oUrl').textContent = TEXT.url;
TEXT.captions.forEach(function (c, i) { var d = document.createElement('div'); d.className = 'cap'; d.id = 'cap' + i; d.textContent = c[2]; $('caption').appendChild(d); });

// Raster
var COLX = [0, 110, 560], COLW = [110, 450, 400], HEADH = 64, ROWH = 84;
function cellRect(c, r) { return { x: COLX[c], y: HEADH + (r - 1) * ROWH, w: COLW[c], h: ROWH }; } // r: 1-basiert, c: 1=A,2=B
var grid = $('grid'), rowEls = [];
function mk(cls, x, y, w, h, html, id) { var d = document.createElement('div'); d.className = 'cell ' + cls; d.style.cssText = 'left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px'; d.innerHTML = html; if (id) d.id = id; grid.appendChild(d); return d; }
mk('hd', 0, 0, 110, HEADH, ''); mk('hd', 110, 0, 450, HEADH, 'A'); mk('hd', 560, 0, 400, HEADH, 'B');
ROWS.forEach(function (row, i) {
  var r = i + 1, y = HEADH + i * ROWH, els = [];
  els.push(mk('hd', 0, y, 110, ROWH, String(r)));
  els.push(mk(i === 0 || i === 5 ? 'bold' : '', 110, y, 450, ROWH, row[0]));
  els.push(mk('num' + (i === 0 ? ' bold' : ''), 560, y, 400, ROWH, row[1], i === 5 ? 'b6' : null));
  rowEls.push(els);
});
function overlay(id, cls) { var d = document.createElement('div'); d.id = id; d.className = cls; grid.appendChild(d); return d; }
var refB2 = overlay('refB2', 'ref'), refB5 = overlay('refB5', 'ref'), refR = overlay('refR', 'ref'), sel = overlay('b6sel', '');
function place(el, rc, inset) { inset = inset || 0; el.style.left = (rc.x + inset) + 'px'; el.style.top = (rc.y + inset) + 'px'; el.style.width = (rc.w - 2 * inset) + 'px'; el.style.height = (rc.h - 2 * inset) + 'px'; }
place(refB2, cellRect(2, 2), 4); place(refB5, cellRect(2, 5), 4);
var rr = cellRect(2, 2), r5 = cellRect(2, 5); place(refR, { x: rr.x, y: rr.y, w: rr.w, h: r5.y + r5.h - rr.y }, 4);
var b6r = cellRect(2, 6); place(sel, b6r, -2);

// ---------- Easing ----------
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function p(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
function lerp(a, b, k) { return a + (b - a) * k; }
var eOut = function (k) { return 1 - Math.pow(1 - k, 3); };
var eInOut = function (k) { return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
var eBack = function (k) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function css(el, o, tf) { el.style.opacity = o; el.style.transform = tf || ''; el.style.visibility = o <= 0.001 ? 'hidden' : 'visible'; }
// Ein- und Ausblenden mit Versatz: in [a,b], out [c,d]
function inOut(t, a, b, c, d) { return eOut(p(t, a, b)) * (1 - eInOut(p(t, c, d))); }

// ---------- Formel-Zustand ----------
var T_TYPE1 = 3900, STEP1 = 260;           // =SUM(B2,B5) tippen
var T_ENTER1 = T_TYPE1 + STEP1 * 11 + 350; // ~7110
var T_EDIT2 = 11050, T_BS = 11350, STEP_BS = 95, T_TYPE2 = 12150, STEP2 = 120;
var T_ENTER2 = T_TYPE2 + STEP2 * 9 + 300;  // ~13530
function formulaAt(t) {
  var w = TEXT.wrong, base = '=SUM', tail = TEXT.right.slice(base.length);
  if (t < T_TYPE1) return { s: '', last: -1e9 };
  if (t < T_EDIT2) { var n = clamp(Math.floor((t - T_TYPE1) / STEP1) + 1, 0, w.length); return { s: w.slice(0, n), last: T_TYPE1 + (n - 1) * STEP1 }; }
  if (t < T_TYPE2) { var k = clamp(Math.floor((t - T_BS) / STEP_BS) + 1, 0, w.length - base.length); return { s: w.slice(0, w.length - k), last: k > 0 ? T_BS + (k - 1) * STEP_BS : T_EDIT2 }; }
  var m = clamp(Math.floor((t - T_TYPE2) / STEP2) + 1, 0, tail.length);
  return { s: base + tail.slice(0, m), last: T_TYPE2 + (m - 1) * STEP2 };
}
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function colorize(s, phaseWrong) {
  var h = esc(s);
  h = h.replace(/^=(SUMME|SUMM|SUM|SU|S)/, function (m0, f) { return '=<span class="' + (phaseWrong && f === 'SUM' && !/^=SUMM/.test(s) && s.length > 4 ? 'bad' : 'fn') + '">' + f + '</span>'; });
  h = h.replace(/B2/, '<span class="r1">B2</span>').replace(/B5/, '<span class="r2">B5</span>');
  if (phaseWrong) h = h.replace(/,/, '<span class="bad">,</span>');
  return h;
}

// ---------- Render ----------
function render(t) {
  // Intro
  var introIn = p(t, 0, 700), introOut = eInOut(p(t, 1750, 2250));
  css($('wm'), eOut(introIn) * (1 - introOut), 'translateY(' + (lerp(40, 0, eOut(introIn)) - 80 * introOut) + 'px) scale(' + lerp(.86, 1, eBack(introIn)) + ')');
  var cIn = p(t, 350, 1050);
  css($('claim'), eOut(cIn) * (1 - introOut), 'translateY(' + (lerp(40, 0, eOut(cIn)) - 60 * introOut) + 'px)');
  $('intro').style.visibility = t > 2300 ? 'hidden' : 'visible';

  // HUD
  var hud = eOut(p(t, 2050, 2550));
  css($('hud'), hud, 'translateY(' + lerp(-30, 0, hud) + 'px)');

  // Aufgabe
  var tk = eOut(p(t, 2500, 3050));
  css($('task'), tk, 'translateY(' + lerp(30, 0, tk) + 'px)');

  // Formelleiste + Tabelle
  var g = eOut(p(t, 2150, 2700));
  css($('fbar'), g, 'translateY(' + lerp(50, 0, g) + 'px)');
  css($('grid'), g, 'translateY(' + lerp(50, 0, g) + 'px)');
  rowEls.forEach(function (els, i) {
    var k = eOut(p(t, 2400 + i * 110, 2800 + i * 110));
    els.forEach(function (e) { e.style.opacity = k; });
    els[1].style.transform = els[2].style.transform = 'translateX(' + lerp(24, 0, k) + 'px)';
  });

  // Mauszeiger: fährt zu B6, klickt (3500), zweiter Klick zur Korrektur (10900)
  var ptr = $('pointer'), ring = $('clickRing');
  var gx = 60, gy = 366; // Grid-Ursprung in der Inhaltsbox
  var tx = gx + b6r.x + b6r.w * .62, ty = gy + b6r.y + b6r.h * .45;
  var m1 = eInOut(p(t, 2900, 3500)), m2 = eInOut(p(t, 10350, 10900));
  var vis = Math.max(inOut(t, 2850, 3050, 3800, 4100), inOut(t, 10300, 10500, 11250, 11500));
  var px = t < 9000 ? lerp(900, tx, m1) : lerp(880, tx, m2), py = t < 9000 ? lerp(1120, ty, m1) : lerp(1180, ty, m2);
  var press = Math.max(1 - Math.abs(t - 3520) / 120, 1 - Math.abs(t - 10920) / 120, 0);
  css(ptr, vis, 'translate(' + px + 'px,' + py + 'px) scale(' + (1 - .15 * press) + ')');
  var rk = Math.max(p(t, 3520, 3950) * (t < 9000 ? 1 : 0), p(t, 10920, 11350) * (t > 9000 ? 1 : 0));
  css(ring, rk > 0 && rk < 1 ? (1 - rk) : 0, 'translate(' + (tx - 45) + 'px,' + (ty - 45) + 'px) scale(' + lerp(.3, 1.4, eOut(rk)) + ')');

  // Zellauswahl
  sel.style.opacity = t > 3520 ? 1 : 0;

  // Formel
  var f = formulaAt(t);
  var editing = (t >= 3520 && t < T_ENTER1) || (t >= T_EDIT2 && t < T_ENTER2);
  var wrongPhase = t < T_EDIT2 + 200;
  var caretOn = editing && ((t - f.last) < 450 || Math.floor((t - f.last) / 500) % 2 === 1);
  var caret = editing ? '<span class="caret" style="opacity:' + (caretOn ? 1 : 0) + '"></span>' : '';
  var fhtml = colorize(f.s, wrongPhase && t >= T_ENTER1);
  $('ftext').innerHTML = (t >= 3520 ? fhtml : '') + caret;
  var b6 = $('b6');
  var done = t >= T_ENTER2;
  if (editing) { b6.innerHTML = '<span style="font-family:var(--mono);font-weight:700;font-size:44px">' + colorize(f.s, false) + '</span>' + caret; b6.style.justifyContent = 'flex-start'; }
  else if (t >= T_ENTER1 && t < T_EDIT2) { b6.innerHTML = '<span style="color:var(--err-line);font-weight:800;font-family:var(--mono)">#NAME?</span>'; b6.style.justifyContent = 'flex-end'; }
  else if (done) { b6.innerHTML = '<span class="bold">' + RESULT + '</span>'; b6.style.justifyContent = 'flex-end'; }
  else { b6.innerHTML = ''; }
  // Farbe B6
  var errK = (t >= T_ENTER1 && t < T_EDIT2) ? 1 : 0;
  var okK = eOut(p(t, T_ENTER2, T_ENTER2 + 300));
  b6.style.background = errK ? 'var(--err-bg)' : (done ? 'rgba(16,124,65,' + (0.18 + .1 * okK) + ')' : 'var(--target)');
  b6.style.color = done ? 'var(--accent-strong)' : '';
  var pop = done ? 1 + .12 * Math.sin(Math.PI * p(t, T_ENTER2, T_ENTER2 + 380)) : 1;
  b6.style.transform = 'scale(' + pop + ')';
  sel.style.borderColor = errK ? 'var(--err-line)' : 'var(--accent)';
  // Referenz-Rahmen nur beim Bearbeiten
  var s = f.s;
  var showR = editing && s.indexOf('B2:B5') >= 0;
  refR.style.opacity = showR ? 1 : 0;
  refB2.style.opacity = editing && !showR && s.indexOf('B2') >= 0 ? 1 : 0;
  refB5.style.opacity = editing && !showR && s.indexOf('B5') >= 0 ? 1 : 0;

  // Feedback rot
  var e1 = inOut(t, 7900, 8350, 10700, 11050);
  var shake = t >= 7900 && t < 8600 ? Math.sin((t - 7900) / 28) * 14 * (1 - p(t, 7900, 8600)) : 0;
  css($('fbErr'), e1, 'translate(' + shake + 'px,' + lerp(40, 0, eOut(p(t, 7900, 8350))) + 'px)');

  // Feedback grün + Medaille
  var o1 = inOut(t, T_ENTER2 + 150, T_ENTER2 + 550, 14850, 15250);
  css($('fbOk'), o1, 'translateY(' + lerp(40, 0, eOut(p(t, T_ENTER2 + 150, T_ENTER2 + 550))) + 'px)');
  var md = p(t, T_ENTER2 + 450, T_ENTER2 + 1050);
  $('medal').style.transform = 'scale(' + (md > 0 ? eBack(md) : 0) + ') rotate(' + lerp(-30, 0, eOut(md)) + 'deg)';

  // XP + Streak
  var xp = Math.round(lerp(40, 50, eOut(p(t, T_ENTER2 + 300, T_ENTER2 + 900))));
  $('xpNum').textContent = xp;
  var stT = 14350, st = t >= stT ? 1 : 0;
  $('streakNum').textContent = st;
  var sp = p(t, stT, stT + 500);
  $('pStreak').style.transform = 'scale(' + (1 + .35 * Math.sin(Math.PI * sp)) + ')';
  $('pStreak').style.borderColor = st ? '#f08c00' : 'var(--border)';
  $('pStreak').style.background = st ? '#fff4e6' : 'var(--surface)';
  var xpp = p(t, T_ENTER2 + 300, T_ENTER2 + 700);
  $('pXp').style.transform = 'scale(' + (1 + .25 * Math.sin(Math.PI * xpp)) + ')';

  // Level-Balken
  var lv = inOut(t, 15050, 15450, 17800, 18100);
  css($('level'), lv, 'translateY(' + lerp(40, 0, eOut(p(t, 15050, 15450))) + 'px)');
  var fill = lerp(80, 100, eInOut(p(t, 15500, 16700)));
  $('lvFill').style.width = fill + '%';
  var up = t >= 16750;
  $('lvName').textContent = up ? TEXT.lvAfter : TEXT.lvBefore;
  $('lvName').style.color = up ? 'var(--accent-strong)' : 'var(--text)';
  var lp = p(t, 16750, 17200);
  $('lvName').style.display = 'inline-block';
  $('lvName').style.transform = 'scale(' + (1 + .14 * Math.sin(Math.PI * lp)) + ')';
  $('lvName').style.transformOrigin = '0 70%';
  $('lvXp').textContent = up ? 'Level-Up!' : Math.round(lerp(40, 50, eInOut(p(t, 15500, 16700)))) + ' / 50 XP';
  $('lvXp').style.color = up ? 'var(--accent)' : '';

  // Untertitel
  TEXT.captions.forEach(function (c, i) {
    var k = inOut(t, c[0], c[0] + 300, c[1] - 250, c[1]);
    css($('cap' + i), k, 'translateY(' + lerp(16, 0, eOut(p(t, c[0], c[0] + 300))) + 'px)');
  });

  // Outro
  var ob = eInOut(p(t, 17900, 18350));
  $('outroBg').style.clipPath = 'circle(' + (ob * 150) + '% at 50% 100%)';
  $('outroBg').style.visibility = ob > 0 ? 'visible' : 'hidden';
  var ol = eOut(p(t, 18150, 18600));
  css($('outro').querySelector('.logo'), ol, 'scale(' + lerp(.6, 1, eBack(p(t, 18150, 18600))) + ')');
  var ow = eOut(p(t, 18250, 18700));
  css($('oWm'), ow, 'translateY(' + lerp(30, 0, ow) + 'px)');
  var of = eOut(p(t, 18400, 18850));
  css($('oFacts'), of, 'translateY(' + lerp(30, 0, of) + 'px)');
  var ou = p(t, 18550, 19000);
  css($('oUrl'), eOut(ou), 'scale(' + lerp(.7, 1, eBack(ou)) + ')');
}

var tParam = q.get('t');
if (tParam !== null) { render(+tParam); }
else {
  var t0 = null;
  (function loop(now) { if (t0 === null) t0 = now; render((now - t0) % DURATION); requestAnimationFrame(loop); })(performance.now());
}
</script>
</body>
</html>
