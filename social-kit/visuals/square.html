<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<title>Excel-Drills Quiz 1080x1080</title>
<!-- Quiz-Format (LI-09, Instagram). Texte direkt im HTML anpassen. -->
<style>
  :root { --g:#107C41; --gd:#0B5A2E; --gl:#E7F2EB; --ink:#1B1F1D; --mut:#5A635E; --line:#D5DDD8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1080px; height:1080px; overflow:hidden; }
  body { margin:0; background:#fff; color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .mono { font-family:"SF Mono", Menlo, Consolas, monospace; }
  .wrap { width:1080px; height:1080px; display:flex; flex-direction:column; padding:0 80px 64px; position:relative; }
  .top { height:20px; background:var(--g); margin:0 -80px; }
  .kicker { margin-top:64px; align-self:flex-start; font-size:24px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--gd); background:var(--gl); padding:10px 18px; border-radius:8px; }
  h1 { margin-top:28px; font-size:66px; line-height:1.08; letter-spacing:-1.6px; font-weight:800; }
  .sheet { margin-top:40px; border:2px solid var(--line); border-radius:16px; overflow:hidden; }
  .fx { display:flex; align-items:center; border-bottom:2px solid var(--line); background:#F7F9F8; height:72px; }
  .fx b { width:80px; text-align:center; font-size:22px; color:var(--mut); border-right:2px solid var(--line); line-height:72px; }
  .fx span { padding:0 22px; font-size:34px; font-weight:600; }
  table { border-collapse:collapse; width:100%; font-size:30px; }
  th, td { border:1px solid var(--line); height:66px; padding:0 18px; }
  th { background:#F0F3F1; color:var(--mut); font-weight:600; font-size:22px; text-align:center; width:60px; }
  td.n { text-align:right; font-variant-numeric:tabular-nums; }
  td.q { background:var(--gl); outline:4px solid var(--g); outline-offset:-4px; text-align:center; font-weight:800; color:var(--g); font-size:40px; }
  .opts { margin-top:40px; display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .opt { display:flex; align-items:center; gap:20px; border:2px solid var(--line); border-radius:14px; padding:20px 24px; font-size:36px; font-weight:600; }
  .opt b { flex:none; width:56px; height:56px; border-radius:50%; background:var(--g); color:#fff; display:flex; align-items:center; justify-content:center; font-size:28px; }
  .foot { margin-top:auto; display:flex; align-items:center; justify-content:space-between; font-size:28px; }
  .brand { display:flex; align-items:center; gap:14px; font-weight:700; }
  .logo { width:46px; height:46px; border-radius:9px; background:var(--g); display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:3px; padding:9px; }
  .logo i { background:rgba(255,255,255,.92); border-radius:2px; }
  .logo i:nth-child(4) { background:rgba(255,255,255,.45); }
  .cta { color:var(--gd); font-weight:700; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"></div>
  <span class="kicker">Formelrätsel</span>
  <h1>Was liefert diese Formel?</h1>
  <div class="sheet">
    <div class="fx"><b class="mono">fx</b><span class="mono">=RUNDEN(A2;-2)</span></div>
    <table>
      <tr><th></th><th style="width:auto">A</th><th style="width:auto">B</th></tr>
      <tr><th>1</th><td><b>Betrag</b></td><td><b>Gerundet</b></td></tr>
      <tr><th>2</th><td class="n">1234.5678</td><td class="q">?</td></tr>
    </table>
  </div>
  <div class="opts">
    <div class="opt"><b>A</b><span class="mono">1234.57</span></div>
    <div class="opt"><b>B</b><span class="mono">1234.56</span></div>
    <div class="opt"><b>C</b><span class="mono">1200</span></div>
    <div class="opt"><b>D</b><span class="mono">1235</span></div>
  </div>
  <div class="foot">
    <div class="brand"><div class="logo"><i></i><i></i><i></i><i></i></div>Excel-Drills</div>
    <div class="cta">Antwort in die Kommentare ↓</div>
  </div>
</div>
</body>
</html>
