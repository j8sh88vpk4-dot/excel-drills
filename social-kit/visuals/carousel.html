<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<title>Excel-Drills Instagram-Karussell 1080x1350 (?c=1..14&s=1..n)</title>
<!--
  Instagram-Karussells (Hochformat 4:5, 1080×1350), Konzepte aus ../instagram-tiktok.md (IG-K1 … IG-K7),
  ab IG-K8 aus ../instagram.md (Differenzierer, Stand 1.11.2026).
  Aufruf: carousel.html?c=1&s=1   c = Karussell 1..14, s = Slide 1..n (ohne Parameter: c=1, s=1)
  1 SVERWEIS-Fehler (7) · 2 Übersetzungen (7) · 3 Einstellungstest (8) · 4 Monatsabschluss (7)
  5 Schweizer Eigenheiten (7) · 6 Warum Videos nicht reichen (7) · 7 Excel-Test, Teste dich selbst (7)
  8 Datei hochladen, Fehler sehen (7) · 9 KI-Interview Frau Keller (8) · 10 Fehler-DNA (7) · 11 Zertifikate SIZ/MOS, ICDL-Stopp (8)
  12 Zellbezüge per Klick, Ziehen, F4 (6) · 13 Kampagne Controlling Tag 1 (7) · 14 SQL-Drills Beta (6)
  Gerendert von render-instagram.sh nach png/instagram/c<nr>-s<nr>.png.
  Design wie linkedin-card.html: grüner Balken, Wortmarke, Zellraster, grosse Typo. Letzte Slide = CTA (grün).
  Formeln in code(): [[…]] = grün markiert, {{…}} = rot markiert.
  Passt der Inhalt nicht in die Slide, verkleinert das Skript unten die Typo schrittweise (--k).
-->
<style>
  :root { --g:#107C41; --gd:#0B5A2E; --gl:#E7F2EB; --red:#C42B1C; --redl:#FBEAE8; --ink:#1B1F1D; --mut:#5A635E; --line:#D5DDD8; --k:1; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1080px; height:1350px; overflow:hidden; }
  body { background:#fff; color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .mono { font-family:"SF Mono", Menlo, Consolas, monospace; }
  .slide { position:relative; width:1080px; height:1350px; display:flex; flex-direction:column; padding:66px 84px 64px 108px;
    background-color:#fff;
    background-image:linear-gradient(rgba(16,124,65,.055) 2px, transparent 2px), linear-gradient(90deg, rgba(16,124,65,.055) 2px, transparent 2px);
    background-size:120px 60px; background-position:-2px -2px; }
  .bar { position:absolute; left:0; top:0; bottom:0; width:20px; background:var(--g); }

  header { display:flex; align-items:center; justify-content:space-between; flex:none; }
  .brand { display:flex; align-items:center; gap:16px; font-weight:800; font-size:32px; letter-spacing:-.3px; }
  .logo { width:52px; height:52px; border-radius:10px; background:var(--g); display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:3px; padding:10px; }
  .logo i { background:rgba(255,255,255,.92); border-radius:2px; }
  .logo i:nth-child(4) { background:rgba(255,255,255,.45); }
  .count { font-size:26px; font-weight:700; color:var(--mut); background:#fff; border:2px solid var(--line); border-radius:999px; padding:8px 20px; font-variant-numeric:tabular-nums; }
  .count b { color:var(--g); }

  main { flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center; gap:calc(34px*var(--k)); padding:30px 0; }
  .kicker { display:inline-block; align-self:flex-start; font-size:calc(26px*var(--k)); font-weight:800; letter-spacing:.8px; text-transform:uppercase; color:var(--gd); background:var(--gl); padding:10px 18px; border-radius:8px; }
  .kicker.red { color:var(--red); background:var(--redl); }
  h1 { font-size:calc(98px*var(--k)); line-height:1.03; letter-spacing:-2.6px; font-weight:800; }
  h2 { font-size:calc(74px*var(--k)); line-height:1.06; letter-spacing:-1.8px; font-weight:800; }
  h1 em, h2 em { font-style:normal; color:var(--g); }
  .sub { font-size:calc(38px*var(--k)); line-height:1.38; color:var(--mut); }
  .sub b { color:var(--ink); }
  .sub .mono { font-size:.9em; color:var(--ink); }

  .cmp { border:2px solid var(--line); border-radius:18px; overflow:hidden; background:#fff; }
  .cmp .lab { display:flex; align-items:center; gap:12px; padding:14px 22px; font-size:calc(27px*var(--k)); font-weight:700; }
  .cmp .code { padding:22px 22px 26px; font-size:calc(38px*var(--k)); line-height:1.38; word-break:normal; overflow-wrap:anywhere; }
  .cmp.bad .lab { background:var(--redl); color:var(--red); }
  .cmp.good { border-color:var(--g); }
  .cmp.good .lab { background:var(--g); color:#fff; }
  .cmp.good .code { background:var(--gl); }
  .cmp.plain .lab { background:#F0F3F1; color:var(--mut); }
  .hl { color:#fff; background:var(--red); border-radius:5px; padding:0 5px; }
  .hg { color:#fff; background:var(--g); border-radius:5px; padding:0 5px; }

  .sheet { border:2px solid var(--line); border-radius:18px; overflow:hidden; background:#fff; box-shadow:0 18px 40px rgba(16,124,65,.12); }
  .fx { display:flex; align-items:center; border-bottom:2px solid var(--line); background:#F7F9F8; min-height:72px; }
  .fx b { flex:none; width:76px; text-align:center; font-size:22px; color:var(--mut); border-right:2px solid var(--line); line-height:72px; }
  .fx span { padding:0 18px; font-size:calc(30px*var(--k)); white-space:nowrap; }
  table { border-collapse:collapse; width:100%; font-size:calc(30px*var(--k)); }
  th, td { border:1px solid var(--line); height:calc(64px*var(--k)); padding:0 16px; white-space:nowrap; }
  th { background:#F0F3F1; color:var(--mut); font-weight:600; font-size:calc(22px*var(--k)); text-align:center; }
  th.r { width:56px; }
  td.n { text-align:right; font-variant-numeric:tabular-nums; }
  td.c { text-align:center; }
  td.h { font-weight:700; }
  td.sel { outline:4px solid var(--g); outline-offset:-4px; background:var(--gl); font-weight:700; color:var(--gd); }
  td.err { outline:4px solid var(--red); outline-offset:-4px; background:var(--redl); font-weight:700; color:var(--red); }
  td.idx { background:var(--g); color:#fff; font-weight:800; text-align:center; height:calc(52px*var(--k)); font-size:.9em; }
  .ok, .no { display:flex; align-items:center; gap:14px; padding:18px 22px; font-weight:700; font-size:calc(28px*var(--k)); }
  .ok { background:var(--g); color:#fff; }
  .no { background:var(--red); color:#fff; }
  .ok .c, .no .c { flex:none; width:36px; height:36px; border-radius:50%; background:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:22px; }
  .ok .c { color:var(--g); } .no .c { color:var(--red); }

  .pairs { display:flex; flex-direction:column; gap:calc(26px*var(--k)); }
  .pair { display:flex; align-items:center; gap:28px; background:#fff; border:2px solid var(--line); border-radius:18px; padding:calc(26px*var(--k)) 30px; }
  .pair .en { flex:none; width:300px; font-size:calc(40px*var(--k)); color:var(--mut); }
  .pair .ar { flex:none; font-size:44px; color:var(--g); font-weight:800; }
  .pair .de { font-size:calc(58px*var(--k)); font-weight:800; color:var(--gd); letter-spacing:-.5px; }

  ul.check, ol.steps { list-style:none; display:flex; flex-direction:column; gap:calc(20px*var(--k)); }
  ul.check li, ol.steps li { display:flex; align-items:center; gap:22px; font-size:calc(40px*var(--k)); font-weight:650; }
  ul.check li i { flex:none; width:46px; height:46px; border:4px solid var(--g); border-radius:8px; background:#fff; }
  ol.steps li b { flex:none; width:62px; height:62px; border-radius:50%; background:var(--g); color:#fff; display:flex; align-items:center; justify-content:center; font-size:32px; }
  ol.steps li small { display:block; font-size:.72em; color:var(--mut); font-weight:500; margin-top:4px; }

  .big { font-size:calc(170px*var(--k)); line-height:1; font-weight:800; letter-spacing:-5px; color:var(--g); font-variant-numeric:tabular-nums; }
  .note { background:#fff; border-left:8px solid var(--g); border-radius:6px; padding:22px 26px; font-size:calc(32px*var(--k)); line-height:1.4; color:var(--ink); box-shadow:0 8px 24px rgba(0,0,0,.05); }
  .chips { display:flex; flex-wrap:wrap; gap:16px; }
  .chip { font-size:calc(32px*var(--k)); font-weight:700; padding:14px 24px; border-radius:999px; background:#fff; border:3px solid var(--g); color:var(--gd); }
  .chip.f { background:var(--g); color:#fff; }
  .refs { display:grid; grid-template-columns:auto 1fr; gap:calc(18px*var(--k)) 28px; align-items:center; background:#fff; border:2px solid var(--line); border-radius:18px; padding:28px 30px; }
  .refs .mono { font-size:calc(48px*var(--k)); font-weight:800; }
  .refs span { font-size:calc(32px*var(--k)); color:var(--mut); }
  .refs .on { color:var(--g); }

  footer { flex:none; display:flex; align-items:center; gap:28px; }
  .prog { flex:1; display:flex; gap:10px; }
  .prog i { flex:1; height:10px; border-radius:5px; background:var(--line); }
  .prog i.on { background:var(--g); }
  .swipe { font-size:26px; font-weight:700; color:var(--gd); white-space:nowrap; }

  /* CTA-Slide (letzte), grün wie story.html */
  .slide.cta { background-color:var(--g); color:#fff;
    background-image:linear-gradient(rgba(255,255,255,.07) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.07) 2px, transparent 2px); }
  .slide.cta .bar { background:var(--gd); }
  .slide.cta .logo { background:#fff; }
  .slide.cta .logo i { background:var(--g); }
  .slide.cta .logo i:nth-child(4) { background:rgba(16,124,65,.4); }
  .slide.cta .count { background:transparent; border-color:rgba(255,255,255,.4); color:rgba(255,255,255,.8); }
  .slide.cta .count b { color:#fff; }
  .slide.cta h1 em, .slide.cta h2 em { color:#B9E5C9; }
  .slide.cta .sub { color:rgba(255,255,255,.88); }
  .slide.cta .sub b { color:#fff; }
  .slide.cta .kicker { background:rgba(255,255,255,.16); color:#fff; }
  .slide.cta .prog i { background:rgba(255,255,255,.3); }
  .slide.cta .prog i.on { background:#fff; }
  .slide.cta .swipe { color:#fff; }
  .pill { align-self:flex-start; background:#fff; color:var(--gd); font-size:calc(50px*var(--k)); font-weight:800; padding:30px 56px; border-radius:999px; box-shadow:0 20px 40px rgba(0,0,0,.18); }
  .facts { display:flex; flex-direction:column; gap:14px; font-size:calc(34px*var(--k)); font-weight:600; }
  .facts div::before { content:"✓"; display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; margin-right:18px; border-radius:50%; background:rgba(255,255,255,.18); font-size:24px; vertical-align:middle; }
  .indep { font-size:22px; color:rgba(255,255,255,.7); }

  /* Ab K8: Chat (K9), Fehler-DNA-Balken (K10), Faktenliste (K11) */
  .chat { display:flex; flex-direction:column; gap:calc(22px*var(--k)); }
  .msg { max-width:88%; border-radius:26px; padding:calc(24px*var(--k)) 30px; font-size:calc(36px*var(--k)); line-height:1.36; box-shadow:0 8px 24px rgba(0,0,0,.06); }
  .msg small { display:block; font-size:.6em; font-weight:800; letter-spacing:.6px; text-transform:uppercase; margin-bottom:8px; opacity:.75; }
  .msg.ai { align-self:flex-start; background:#fff; border:2px solid var(--line); border-bottom-left-radius:6px; }
  .msg.me { align-self:flex-end; background:var(--g); color:#fff; border-bottom-right-radius:6px; }
  .msg .mono { font-size:.9em; }
  .msg.me .mono { background:rgba(255,255,255,.18); border-radius:6px; padding:0 6px; }
  .dna { display:flex; flex-direction:column; gap:calc(20px*var(--k)); background:#fff; border:2px solid var(--line); border-radius:18px; padding:28px 30px; }
  .dna .r { display:grid; grid-template-columns:360px 1fr 80px; align-items:center; gap:18px; font-size:calc(28px*var(--k)); font-weight:650; }
  .dna .r i { display:block; height:26px; border-radius:13px; background:var(--gl); overflow:hidden; }
  .dna .r i b { display:block; height:100%; background:var(--g); }
  .dna .r i b.w { background:var(--red); }
  .dna .r span { text-align:right; color:var(--mut); font-variant-numeric:tabular-nums; }
  .dna .demo { font-size:22px; color:var(--mut); text-align:right; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:calc(16px*var(--k)) 26px; background:#fff; border:2px solid var(--line); border-radius:18px; padding:26px 30px; font-size:calc(32px*var(--k)); line-height:1.3; }
  .kv b { color:var(--gd); font-weight:800; white-space:nowrap; }
  .src { font-size:calc(24px*var(--k)); color:var(--mut); }
</style>
</head>
<body>
<div class="slide" id="slide">
  <div class="bar"></div>
  <header>
    <div class="brand"><div class="logo"><i></i><i></i><i></i><i></i></div>Excel-Drills</div>
    <div class="count" id="count"></div>
  </header>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>
<script>
(function () {
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function fm(s) { // Formel mit Markierungen [[grün]] und {{rot}}
    return esc(s).replace(/\[\[(.+?)\]\]/g, '<span class="hg">$1</span>').replace(/\{\{(.+?)\}\}/g, '<span class="hl">$1</span>')
      .replace(/;(?![^<]*<\/span>)/g, ';<wbr>'); // Umbruch bevorzugt nach Semikolon
  }
  function K(t, red) { return '<span class="kicker' + (red ? ' red' : '') + '">' + t + '</span>'; }
  function H1(t) { return '<h1>' + t + '</h1>'; }
  function H2(t) { return '<h2>' + t + '</h2>'; }
  function P(t) { return '<p class="sub">' + t + '</p>'; }
  function NOTE(t) { return '<div class="note">' + t + '</div>'; }
  function C(kind, label, code) { // kind: good | bad | plain
    var ic = kind === 'good' ? '✓ ' : kind === 'bad' ? '✗ ' : '';
    return '<div class="cmp ' + kind + '"><div class="lab">' + ic + label + '</div><div class="code mono">' + fm(code) + '</div></div>';
  }
  function SHEET(fx, rows, foot) {
    var h = '<div class="sheet">' + (fx ? '<div class="fx"><b class="mono">fx</b><span class="mono">' + fm(fx) + '</span></div>' : '') + '<table>';
    var rn = 0;
    rows.forEach(function (r, i) {
      var isIdx = i > 0 && r.every(function (c) { return c && c.c === 'idx'; }); // Index-Zeile ohne Zeilennummer
      if (i > 0 && !isIdx) rn++;
      h += '<tr>' + (i === 0 || isIdx ? '<th class="r"></th>' : '<th class="r">' + rn + '</th>');
      r.forEach(function (c) {
        if (i === 0) { h += '<th>' + c + '</th>'; return; }
        var cls = '', v = c;
        if (c && typeof c === 'object') { cls = c.c; v = c.v; }
        h += '<td class="' + cls + '">' + (v == null ? '' : v) + '</td>';
      });
      h += '</tr>';
    });
    h += '</table>';
    if (foot) h += foot.ok ? '<div class="ok"><span class="c">✓</span>' + foot.ok + '</div>' : '<div class="no"><span class="c">✗</span>' + foot.no + '</div>';
    return h + '</div>';
  }
  function Hd(v) { return { c: 'h', v: v }; }
  function N(v) { return { c: 'n', v: v }; }
  function S(v) { return { c: 'n sel', v: v }; }
  function E(v) { return { c: 'n err', v: v }; }
  function I(v) { return { c: 'idx', v: v }; }
  function PAIRS(list) {
    return '<div class="pairs">' + list.map(function (p) {
      return '<div class="pair"><span class="en mono">' + p[0] + '</span><span class="ar">→</span><span class="de mono">' + p[1] + '</span></div>';
    }).join('') + '</div>';
  }
  function CHECK(list) { return '<ul class="check">' + list.map(function (t) { return '<li><i></i>' + t + '</li>'; }).join('') + '</ul>'; }
  function STEPS(list) { return '<ol class="steps">' + list.map(function (t, i) { return '<li><b>' + (i + 1) + '</b><span>' + t + '</span></li>'; }).join('') + '</ol>'; }
  function CTA(o) {
    return { cta: true, html: (o.kicker ? K(o.kicker) : '') + H1(o.h) + (o.sub ? P(o.sub) : '') +
      '<div class="pill">' + (o.pill || 'Link in Bio') + '</div>' +
      '<div class="facts">' + o.facts.map(function (f) { return '<div>' + f + '</div>'; }).join('') + '</div>' +
      '<p class="indep">Unabhängiges Projekt, nicht mit Microsoft verbunden.</p>' };
  }

  var CAR = {
    /* IG-K1 «3 Fehler, die jeder in SVERWEIS macht» */
    1: [
      K('SVERWEIS') + H1('3 Fehler, die <em>jeder</em> in SVERWEIS macht') +
        P('Und keiner gibt eine Fehlermeldung. Die Zahl sieht plausibel aus.') +
        C('bad', 'Sieht richtig aus, ist es aber nicht', '=SVERWEIS(D2;A2:B6;2{{ }})'),
      K('Fehler 1', true) + H2('<em>FALSCH</em> vergessen') +
        C('bad', 'Sucht nur ungefähr', '=SVERWEIS(D2;A2:B6;2)') +
        P('Ohne viertes Argument sucht SVERWEIS die <b>nächstkleinere</b> Übereinstimmung. Bei einer unsortierten Preisliste holt er den falschen Preis, ohne #NV.'),
      K('So richtig') + H2('Viertes Argument: <em>FALSCH</em>') +
        C('good', 'Exakte Suche', '=SVERWEIS(D2;A2:B6;2;[[FALSCH]])') +
        P('FALSCH (oder 0) heisst: nur exakte Treffer. Fast immer das, was du willst.') +
        NOTE('Findet er nichts, kommt <b>#NV</b>. Das ist gut: Ein sichtbarer Fehler ist besser als eine falsche Zahl.'),
      K('Fehler 2', true) + H2('Matrix nicht <em>fixiert</em>') +
        C('bad', 'Nach dem Runterziehen in Zeile 3', '=SVERWEIS(D3;{{A3:B7}};2;FALSCH)') +
        C('good', 'Mit $ bleibt die Matrix stehen', '=SVERWEIS(D2;[[$A$2:$B$6]];2;FALSCH)') +
        P('Tipp: Bezug markieren und <b>F4</b> drücken, Excel setzt die $-Zeichen.'),
      K('Fehler 3', true) + H2('Spaltenindex falsch <em>gezählt</em>') +
        SHEET('=SVERWEIS(H2;$C$2:$F$9;[[2]];FALSCH)', [
          ['C', 'D', 'E', 'F'],
          [I('1'), I('2'), I('3'), I('4')],
          [Hd('Art.-Nr.'), Hd('Preis'), Hd('Lager'), Hd('Lieferant')],
          ['A-100', S('12.50'), N('48'), 'Muster AG'],
          ['A-200', N('8.90'), N('120'), 'Beispiel GmbH']
        ]) +
        P('Gezählt wird ab der <b>ersten Spalte der Matrix</b>, nicht ab Spalte A. Matrix C:F → C = 1, D = 2.'),
      K('Bonus') + H2('Suchspalte muss <em>links</em> stehen') +
        P('SVERWEIS sucht nur in der ersten Spalte der Matrix und liest nach rechts. Steht die Suchspalte rechts davon:') +
        C('good', 'XVERWEIS (neuere Excel-Versionen)', '=XVERWEIS(D2;B2:B6;A2:A6)') +
        C('plain', 'oder INDEX/VERGLEICH (alle Versionen)', '=INDEX(A2:A6;VERGLEICH(D2;B2:B6;0))'),
      CTA({ kicker: 'Lesen ≠ können', h: 'Jetzt selbst <em>tippen</em>.', sub: 'Übe SVERWEIS gratis, mit Sofort-Prüfung im Browser.',
        facts: ['18 Übungen gratis, ohne Anmeldung', 'Deutsche Funktionsnamen, Semikolon', 'Bronze, Silber, Gold pro Übung'] })
    ],

    /* IG-K2 «Excel auf Deutsch: Die 8 wichtigsten Übersetzungen» */
    2: [
      K('Excel auf Deutsch') + H1('SUM heisst bei dir <em>SUMME</em>?') +
        P('Die 8 Übersetzungen, die du für englische Tutorials brauchst.') +
        SHEET('=SUM(B2:B4)', [
          ['A', 'B'],
          [Hd('Filiale'), Hd('Umsatz CHF')],
          ['Bern', N("48'200")],
          ['Basel', N("39'750")],
          ['Luzern', N("27'400")],
          [Hd('Total'), E('#NAME?')]
        ]),
      K('Übersetzung 1 und 2') + H2('Summe und <em>Durchschnitt</em>') +
        PAIRS([['SUM', 'SUMME'], ['AVERAGE', 'MITTELWERT']]) +
        C('good', 'Beispiel', '=MITTELWERT(B2:B13)'),
      K('Übersetzung 3 und 4') + H2('Bedingungen und <em>Fehler</em>') +
        PAIRS([['IF', 'WENN'], ['IFERROR', 'WENNFEHLER']]) +
        C('good', 'Beispiel: Division durch 0 abfangen', '=WENNFEHLER(B2/C2;0)'),
      K('Übersetzung 5 und 6') + H2('Nachschlagen') +
        PAIRS([['VLOOKUP', 'SVERWEIS'], ['XLOOKUP', 'XVERWEIS']]) +
        C('good', 'Beispiel', '=SVERWEIS(D2;$A$2:$B$6;2;FALSCH)'),
      K('Übersetzung 7 und 8') + H2('Summieren und zählen mit <em>Bedingung</em>') +
        PAIRS([['SUMIF', 'SUMMEWENN'], ['COUNTIF', 'ZÄHLENWENN']]) +
        C('good', 'Beispiel', '=ZÄHLENWENN(A:A;"Zürich")'),
      K('Und das Komma?') + H2('Wird zum <em>Semikolon</em>.') +
        C('bad', 'Englisches Tutorial', '=IF(A2>100{{,}}"hoch"{{,}}"tief")') +
        C('good', 'Dein Excel auf Deutsch', '=[[WENN]](A2>100[[;]]"hoch"[[;]]"tief")') +
        P('Gilt auch in der Schweiz, obwohl dort der Punkt das Dezimalzeichen ist.'),
      CTA({ kicker: 'Speichern für später', h: 'Und dann selbst <em>tippen</em>.', sub: 'Excel-Übungen auf Deutsch, mit Sofort-Prüfung. Tippst du SUM, sagt dir die Übung: SUMME.',

        NOTE('Empfehlung: aktuell auf <b>SIZ oder MOS</b> setzen. Der Inhalt des ICDL-Moduls Tabellenkalkulation deckt sich weitgehend mit SIZ AU4.') +
        '<p class="src">Stand 1.11.2026, Quelle: xcdl.ch</p>',
      K('SIZ · Advanced-User') + H2('AU4 <em>Tabellen</em>') +
        P('Der Schweizer Standard für Excel im Büro.') +
        '<div class="kv"><b>Kosten</b><span>CHF 110 (Partnerschule) bzw. CHF 132 (SIZ)</span><b>Vorbereitung</b><span>28 Lektionen empfohlen</span><b>Inhalt</b><span>Formatieren, SUMME bis XVERWEIS, Pivot, Diagramme, Import/Export</span></div>' +
        '<p class="src">Quelle: siz.ch, Stand 1.11.2026</p>',
      K('SIZ · Power-User') + H2('PU41 <em>Tabellen &amp; Daten</em>') +
        P('Für Finanz- und Rechnungswesen und Datenprofis.') +
        '<div class="kv"><b>Kosten</b><span>CHF 260 (Partnerschule) bzw. CHF 312 (SIZ)</span><b>Vorbereitung</b><span>40 Lektionen empfohlen</span><b>Inhalt</b><span>70 Prüfungsfunktionen, Power Query, Pivot, Power Pivot</span></div>' +
        '<p class="src">Quelle: siz.ch, Stand 1.11.2026</p>',
      K('Microsoft Office Specialist') + H2('MO-210 <em>Associate</em> und MO-211 <em>Expert</em>') +
        '<div class="kv"><b>Prüfung</b><span>50 Minuten, praktisch in Excel, im Testcenter</span><b>Bestehen</b><span>MO-210: ab 700 von 1000 Punkten</span><b>Sprache</b><span>u. a. Deutsch, Französisch, Italienisch</span><b>MO-211</b><span>Expert-Stufe: erweiterte Formeln, Makros, Pivots</span></div>' +
        '<p class="src">Quelle: learn.microsoft.com, Stand 1.11.2026</p>',
      K('Ehrlich') + H2('Was wir abdecken, und <em>was nicht</em>') +
        P('Excel-Drills trainiert den <b>Funktionsteil</b>: Formeln tippen, sofort prüfen, mit deutschen oder englischen Funktionsnamen.') +
        NOTE('Pivot, Diagramme, Drucklayout, Power Query: Dafür gibt es pro Zertifikat eine Checkliste zum Üben in Excel selbst.'),
      K('So bereitest du dich vor') + H2('In <em>3 Schritten</em>') +
        STEPS(['Zertifikat wählen<small>Büro: AU4 · Finanz/Daten: PU41 · international: MOS</small>', 'Kampagne für den Funktionsteil<small>Tag 1 bis 3 gratis</small>', 'Checkliste in Excel abhaken<small>Formatieren, Pivot, Diagramme</small>']),
      CTA({ kicker: 'Zertifikate', h: '4 Kampagnen. <em>Je 3 Tage gratis.</em>', sub: 'SIZ AU4, SIZ PU41, MOS MO-210 und MO-211.',
        pill: 'excel-drills.ch/zertifikate',
        facts: ['Funktionsnamen DE/EN umschaltbar', 'Ehrliche Checkliste für den Rest'] })
    ],

    /* IG-K12 «Klicken statt tippen: Zellbezüge wie in Excel» */
    12: [
      K('Neu in der App') + H1('Klicken statt tippen. <em>Wie in Excel.</em>') +
        P('3 Tipps für Zellbezüge, die auch in deinem echten Excel funktionieren.'),
      K('Tipp 1 von 3') + H2('Zelle <em>anklicken</em>') +
        SHEET('=B3*[[C1]]', [
          ['A', 'B', 'C'],
          [Hd('MwSt-Satz'), '', S('8.1 %')],
          [Hd('Artikel'), Hd('Netto CHF'), Hd('MwSt CHF')],
          ['Velo', N("1'250.00"), { c: 'n', v: '' }]
        ]) +
        P('Während du die Formel schreibst: Zelle anklicken, der Bezug landet genau an der Cursorposition.'),
      K('Tipp 2 von 3') + H2('Bereich <em>ziehen</em>') +
        SHEET('=SUMME([[B2:B5]])', [
          ['A', 'B'],
          [Hd('Filiale'), Hd('Umsatz CHF')],
          ['Zürich', S("12'500")],
          ['Bern', S("8'300")],
          ['Basel', S("9'100")],
          ['Luzern', S("4'700")],
          [Hd('Total'), N("34'600")]
        ]) +
        P('Shift-Klick geht auch. Klick auf den Spaltenkopf ergibt <span class="mono">B:B</span>.'),
      K('Tipp 3 von 3') + H2('<em>F4</em> setzt die $-Zeichen') +
        '<div class="refs">' +
          '<span class="mono">B3</span><span>Start: wandert mit</span>' +
          '<span class="mono on">$B$3</span><span>1× F4: ganz fix</span>' +
          '<span class="mono">B$3</span><span>2× F4: Zeile fix</span>' +
          '<span class="mono">$B3</span><span>3× F4: Spalte fix</span>' +
        '</div>' +
        P('Cursor in den Bezug, F4 drücken. Excel auf dem Mac: <b>Cmd+T</b>.'),
      K('Warum das zählt') + H2('Weniger Tippfehler, <em>mehr Tempo</em>.') +
        P('Im Einstellungstest zählt jede Minute. Wer Bezüge klickt, vertippt sich nicht bei Zeile oder Spalte.') +
        NOTE('Der beste Shortcut ist der, den du schon beim Üben benutzt.'),
      CTA({ kicker: 'Gleich ausprobieren', h: 'Klick, zieh, <em>F4</em>.', sub: 'Funktioniert in jeder Übung, auch in den Gratis-Übungen.',
        facts: ['18 Übungen gratis, ohne Anmeldung', 'Deutsch, Semikolon, CHF'] })
    ],

    /* IG-K13 «Dein erster Tag als Controllerin» (Kampagne controlling-monat-1, Tag 1) */
    13: [
      K('Kampagne Controlling') + H1('Dein erster Tag als <em>Controllerin</em>.') +
        P('Eine Mini-Aufgabe aus der Kampagne. Löst du sie, bevor du weiterwischst?'),
      K('Tag 1 · Herr Steiner') + H2('Die erste <em>Aufgabe</em>') +
        NOTE('«Willkommen bei der Alpina Logistik AG! Bevor wir den Januar abschliessen, will ich wissen, wie viele Lieferantenrechnungen noch offen sind.»') +
        P('Die Alpina Logistik AG ist fiktiv, die Aufgabe kommt aus dem Alltag.'),
      K('Die OP-Liste') + H2('8 Rechnungen, wie viele sind <em>offen</em>?') +
        SHEET('', [
          ['A', 'B', 'C', 'D'],
          [Hd('Rechnung'), Hd('KST'), Hd('CHF'), Hd('Status')],
          ['K-2601', 'Lager', N("1'840.50"), 'bezahlt'],
          ['K-2602', 'Transport', N("3'215.80"), 'offen'],
          ['K-2603', 'Verwaltung', N('412.35'), 'offen'],
          ['K-2604', 'Transport', N("7'980.00"), 'bezahlt'],
          ['K-2605', 'Lager', N('655.20'), 'offen'],
          ['K-2606', 'Verwaltung', N("1'290.00"), 'bezahlt'],
          ['K-2607', 'Transport', N("2'460.75"), 'offen'],
          ['K-2608', 'Lager', N('918.40'), 'offen']
        ]),
      K('Deine Aufgabe') + H2('Welche Formel zählt die <em>offenen</em> Posten?') +
        P('Status in <span class="mono">D2:D9</span>, das Kriterium «offen» steht in <span class="mono">F2</span>.') +
        C('plain', 'A', '=ANZAHL(D2:D9)') +
        C('plain', 'B', '=ZÄHLENWENN(D2:D9;F2)') +
        C('plain', 'C', '=SUMMEWENN(D2:D9;"offen")') +
        P('Antwort in die Kommentare, dann weiter.'),
      K('Auflösung') + H2('<em>B</em>: ZÄHLENWENN') +
        C('good', 'Bereich fixiert, Kriterium als Bezug', '=ZÄHLENWENN([[$D$2:$D$9]];F2)') +
        SHEET('', [
          ['F', 'G'],
          [Hd('Status'), Hd('Anzahl')],
          ['offen', S('5')]
        ], { ok: '5 offene Posten' }),
      K('Warum nicht A und C?', true) + H2('Zählen ist nicht <em>summieren</em>') +
        P('<b>A:</b> ANZAHL zählt nur Zahlen. Der Status ist Text, Ergebnis 0.') +
        P('<b>C:</b> SUMMEWENN summiert Beträge. Hier gibt es nichts zu summieren, Ergebnis 0.') +
        NOTE('Tipp: Bezug auf F2 statt "offen" fest eintippen. Dann wechselst du auf «bezahlt», ohne die Formel anzufassen.'),
      CTA({ kicker: 'Dein erster Monat als Controllerin', h: '8 Tage. <em>3 gratis.</em>', sub: 'Offene Posten, Kostenstellen, Budget/Ist, MwSt, 5 Rappen, Duplikate, Abgrenzung, Forecast.',
        pill: 'excel-drills.ch/kampagne',
        facts: ['Ein durchgehender Datensatz', 'Tag 1 bis 3 ohne Anmeldung'] })
    ],

    /* IG-K14 «SQL-Drills (Beta): SQL für Excel-Leute» */
    14: [
      K('Beta') + H1('Du kannst SUMMEWENN? Dann kannst du fast schon <em>SQL</em>.') +
        P('3 Übersetzungen von Excel nach SQL. Und ein neues Schwesterprojekt zum Üben.'),
      K('Übersetzung 1') + H2('Filtern und zählen: <em>WHERE</em>') +
        C('plain', 'Excel', '=ZÄHLENWENN(A:A;"Zürich")') +
        C('good', 'SQL', "SELECT COUNT(*) FROM filialen WHERE ort = 'Zürich'") +
        P('WHERE ist dein Filter. Text in einfachen Anführungszeichen.'),
      K('Übersetzung 2') + H2('Summe pro Gruppe: <em>GROUP BY</em>') +
        C('plain', 'Excel, eine Formel pro Ort', '=SUMMEWENN(A:A;"Zürich";B:B)') +
        C('good', 'SQL, alle Orte auf einmal', 'SELECT ort, SUM(umsatz) FROM verkauf GROUP BY ort') +
        P('Wie eine Pivot-Tabelle, nur als eine Zeile Text.'),
      K('Übersetzung 3') + H2('Nachschlagen: <em>JOIN</em>') +
        C('plain', 'Excel', '=SVERWEIS(A2;Artikel!$A:$B;2;FALSCH)') +
        C('good', 'SQL', 'SELECT b.nr, a.preis FROM bestellung b JOIN artikel a ON a.nr = b.nr') +
        P('Der JOIN verbindet zwei Tabellen über eine gemeinsame Spalte, wie FALSCH: nur exakte Treffer.'),
      K('Was SQL-Drills ist') + H2('SQL üben wie <em>Excel-Drills</em>') +
        CHECK(['41 Übungen: SELECT, JOIN, GROUP BY', 'Läuft direkt im Browser', 'Gedacht für Leute, die Excel schon können']) +
        NOTE('Noch <b>Beta</b>. Wenn etwas hakt, schreib es in die Kommentare.'),
      CTA({ kicker: 'SQL-Drills (Beta)', h: 'Der nächste Schritt nach <em>Excel</em>.', sub: 'Für alle, die mit Daten arbeiten und mehr wollen als Formeln.',
        pill: 'sql-drills.onrender.com',
        facts: ['41 Übungen im Browser', 'Ein Projekt von Excel-Drills'] })
    ]
  };

  var q = new URLSearchParams(location.search);
  var c = parseInt(q.get('c'), 10); if (!CAR[c]) c = 1;
  var list = CAR[c];
  var s = parseInt(q.get('s'), 10); if (!(s >= 1 && s <= list.length)) s = 1;
  var item = list[s - 1];
  var isCta = typeof item === 'object';
  var html = isCta ? item.html : item;

  var slide = document.getElementById('slide');
  if (isCta) slide.classList.add('cta');
  document.getElementById('count').innerHTML = '<b>' + s + '</b> / ' + list.length;
  document.getElementById('main').innerHTML = html;
  var prog = '<div class="prog">';
  for (var i = 1; i <= list.length; i++) prog += '<i' + (i <= s ? ' class="on"' : '') + '></i>';
  prog += '</div>';
  var hint = s === 1 ? 'Wischen →' : s < list.length ? 'Weiter →' : 'Speichern ↓';
  document.getElementById('foot').innerHTML = prog + '<span class="swipe">' + hint + '</span>';
  document.title = 'Excel-Drills Karussell ' + c + ' Slide ' + s;

  // Passt nicht? Typo schrittweise verkleinern.
  var main = document.getElementById('main'), k = 1;
  function over() {
    var kids = main.children; if (!kids.length) return false;
    var top = kids[0].getBoundingClientRect().top, bottom = kids[kids.length - 1].getBoundingClientRect().bottom;
    var wide = Array.prototype.some.call(main.querySelectorAll('*'), function (el) { return el.scrollWidth > el.clientWidth + 1 && getComputedStyle(el).overflow !== 'visible' || el.getBoundingClientRect().right > main.getBoundingClientRect().right + 1; });
    return bottom - top > main.clientHeight - 60 || wide;
  }
  while (over() && k > 0.66) { k -= 0.03; document.documentElement.style.setProperty('--k', k.toFixed(2)); }
  if (over()) document.title += ' (ÜBERLAUF)';
})();
</script>
